version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
      test:
        patterns: ["org.wiremock*", "org.jacoco*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
